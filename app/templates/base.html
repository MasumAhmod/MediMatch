<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=5.0"
    >
    <title>
        {% block title %}
        MediMatch
        {% endblock %}
    </title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >
    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', path='css/custom.css') }}?v=3.0"
    >

    {% block head %}
    {% endblock %}
</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->
    {% include 'header.html' %}

    <!-- =====================================================
         MAIN CONTENT
    ====================================================== -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- =====================================================
         FOOTER
    ====================================================== -->
    {% include 'footer.html' %}

    <!-- =====================================================
         GLOBAL JAVASCRIPT
    ====================================================== -->
    <script
        src="{{ url_for('static', path='js/script.js') }}?v=3.0"
    ></script>

    {% block scripts %}
    {% endblock %}

</body>
</html>

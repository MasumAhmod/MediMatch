<header>

<div class="app-container">

    <!-- =================================================
         MAIN HEADER BAR
    ================================================== -->

    <div class="header-inner">


        <!-- =================================================
             LOGO
        ================================================== -->

        <a
            href="/"
            class="brand-logo"
            aria-label="MediMatch Home"
        >

            <div
                class="logo-badge"
                aria-hidden="true"
            ></div>

            <span class="brand-text">
                Medi<span class="brand-accent">Match</span>
            </span>

        </a>


        <!-- =================================================
             DESKTOP NAVIGATION
        ================================================== -->

        <nav
            class="desktop-nav"
            aria-label="Main navigation"
        >

            <a
                href="/"
                class="nav-link {% if request.url.path == '/' %}active{% endif %}"
            >
                Home
            </a>

            <a
                href="/symptoms"
                class="nav-link {% if request.url.path == '/symptoms' %}active{% endif %}"
            >
                Symptoms
            </a>

            <a
                href="/doctors"
                class="nav-link {% if request.url.path == '/doctors' %}active{% endif %}"
            >
                Doctors
            </a>

            <a
                href="/about"
                class="nav-link {% if request.url.path == '/about' %}active{% endif %}"
            >
                About
            </a>

            <a
                href="/contact"
                class="nav-link {% if request.url.path == '/contact' %}active{% endif %}"
            >
                Contact
            </a>

        </nav>


        <!-- =================================================
             HEADER RIGHT
        ================================================== -->

        <div class="header-right">


            <!-- =================================================
                 LOGIN - COMING SOON
            ================================================== -->

            <button
                type="button"
                disabled
                aria-disabled="true"
                title="Login will be available soon"
                class="header-login-btn"
            >

                <!-- Lock Icon -->

                <svg
                    width="15"
                    height="15"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="1.8"
                        d="M16 10V7a4 4 0 0 0-8 0v3"
                    />

                    <rect
                        x="5"
                        y="10"
                        width="14"
                        height="10"
                        rx="2"
                        stroke-width="1.8"
                    />

                </svg>


                <span>Login</span>

                <span class="login-soon">
                    Soon
                </span>

            </button>


            <!-- =================================================
                 MOBILE MENU BUTTON
            ================================================== -->

            <button
                id="mobile-menu-button"
                type="button"
                class="mobile-menu-btn"
                aria-label="Open navigation menu"
                aria-controls="mobile-menu"
                aria-expanded="false"
            >

                <!-- Menu Icon -->

                <svg
                    class="menu-icon"
                    width="24"
                    height="24"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M4 6h16M4 12h16M4 18h16"
                    />

                </svg>


                <!-- Close Icon -->

                <svg
                    class="close-icon"
                    width="24"
                    height="24"
                    fill="none"
                    stroke="currentColor"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M6 6l12 12M18 6L6 18"
                    />

                </svg>

            </button>

        </div>

    </div>


    <!-- =================================================
         MOBILE NAVIGATION
    ================================================== -->

    <div
        id="mobile-menu"
        class="hidden"
    >

        <nav
            class="mobile-nav"
            aria-label="Mobile navigation"
        >

            <a
                href="/"
                class="mobile-nav-link {% if request.url.path == '/' %}active{% endif %}"
            >
                <span>Home</span>
            </a>

            <a
                href="/symptoms"
                class="mobile-nav-link {% if request.url.path == '/symptoms' %}active{% endif %}"
            >
                <span>Symptoms</span>
            </a>

            <a
                href="/doctors"
                class="mobile-nav-link {% if request.url.path == '/doctors' %}active{% endif %}"
            >
                <span>Doctors</span>
            </a>

            <a
                href="/about"
                class="mobile-nav-link {% if request.url.path == '/about' %}active{% endif %}"
            >
                <span>About</span>
            </a>

            <a
                href="/contact"
                class="mobile-nav-link {% if request.url.path == '/contact' %}active{% endif %}"
            >
                <span>Contact</span>
            </a>

        </nav>

    </div>

</div>

</header>

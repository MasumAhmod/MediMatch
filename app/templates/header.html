<!-- =========================================================
     MOBILE MENU SCRIPT
========================================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const menuButton =
            document.getElementById(
                "mobile-menu-button"
            );

        const mobileMenu =
            document.getElementById(
                "mobile-menu"
            );


        if (!menuButton || !mobileMenu) {
            return;
        }


        menuButton.addEventListener(
            "click",
            () => {

                const isOpen =
                    !mobileMenu.classList.contains(
                        "hidden"
                    );


                mobileMenu.classList.toggle(
                    "hidden"
                );


                menuButton.setAttribute(
                    "aria-expanded",
                    String(!isOpen)
                );

            }
        );

    }

);

</script>

{% extends "base.html" %}

{% block title %}
Doctor Profile - MediMatch
{% endblock %}

{% block content %}

<div class="doctor-profile-page">

    <div class="doctor-profile-container">

        <!-- =================================================
             BACK
        ================================================== -->

        <a
            href="/doctors"
            class="doctor-back-link"
        >
            <span>←</span>
            Back to Doctors
        </a>


        <!-- =================================================
             DOCTOR PROFILE
        ================================================== -->

        <div id="doctor-profile">

            <div class="doctor-loading">

                <div class="doctor-loading-spinner"></div>

                <p>
                    Loading doctor profile...
                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for('static', path='js/doctor.js') }}?v=2.0"
></script>

{% endblock %}

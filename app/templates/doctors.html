{% extends "base.html" %}

{% block title %}
Doctors - MediMatch
{% endblock %}


{% block content %}

<section class="page-wrapper">

    <div class="app-container">

        <!-- =====================================================
             HEADER
             ===================================================== -->

        <div style="margin-bottom: 1.5rem;">

            <h1 style="font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 800; color: #0f172a; margin: 0;">
                Doctors
            </h1>

            <p
                id="doctors-subtitle"
                style="font-size: 0.95rem; color: #64748b; margin-top: 0.35rem;"
            >
                Find the best specialists near you.
            </p>

        </div>


        <!-- =====================================================
             SPECIALIZATION MESSAGE
             ===================================================== -->

        <div
            id="specialization-message"
            class="hidden"
            style="margin-bottom: 1.5rem; padding: 0.85rem 1.25rem; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 0.75rem; color: #1e40af; font-size: 0.9rem;"
        >
            Showing doctors for:
            <strong id="selected-specialization"></strong>
        </div>


        <!-- =====================================================
             FILTERS
             ===================================================== -->

        <div style="background: #ffffff; border: 1px solid #e2e8f0; border-radius: 1rem; padding: 1.25rem; margin-bottom: 2rem; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.04);">

            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0.85rem; align-items: center;">

                <!-- Search -->

                <input
                    id="doctor-search"
                    type="text"
                    placeholder="Search doctors..."
                    class="form-input"
                >


                <!-- Specialization -->

                <select
                    id="specialization-filter"
                    class="form-input"
                >
                    <option value="">
                        Specialization
                    </option>
                </select>


                <!-- City -->

                <select
                    id="city-filter"
                    class="form-input"
                >
                    <option value="">
                        Location
                    </option>

                    <option value="Sylhet">
                        Sylhet
                    </option>

                    <option value="Dhaka">
                        Dhaka
                    </option>

                    <option value="Chattogram">
                        Chattogram
                    </option>

                    <option value="Rajshahi">
                        Rajshahi
                    </option>
                </select>


                <!-- Fee -->

                <select
                    id="fee-filter"
                    class="form-input"
                >
                    <option value="">
                        Fees
                    </option>

                    <option value="500">
                        Up to Tk. 500
                    </option>

                    <option value="1000">
                        Up to Tk. 1000
                    </option>

                    <option value="1500">
                        Up to Tk. 1500
                    </option>
                </select>


                <!-- Search Button -->

                <button
                    id="doctor-filter-button"
                    type="button"
                    class="btn btn-primary"
                    style="width: 100%; min-height: 46px;"
                >
                    Search
                </button>

            </div>

        </div>


        <!-- =====================================================
         LOADING
         ===================================================== -->

        <div
            id="doctors-loading"
            style="text-align: center; padding: 3rem 1rem; color: #64748b; font-size: 0.95rem;"
        >
            Loading doctors...
        </div>


        <!-- =====================================================
             DOCTORS GRID
             ===================================================== -->

        <div
            id="doctors-container"
            style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem;"
        >
        </div>


        <!-- =====================================================
             NO DOCTORS
             ===================================================== -->

        <div
            id="doctors-empty"
            class="hidden"
            style="text-align: center; padding: 3rem 1rem; color: #64748b; font-size: 0.95rem;"
        >
            No doctors found for this specialization.
        </div>


        <!-- =====================================================
             ERROR
             ===================================================== -->

        <div
            id="doctors-error"
            class="hidden"
            style="padding: 1rem; background: #fef2f2; border: 1px solid #fecaca; border-radius: 0.75rem; color: #991b1b; font-size: 0.9rem;"
        >
        </div>

    </div>

</section>

{% endblock %}


{% block scripts %}

<script
    src="{{ url_for('static', path='js/doctors.js') }}?v=2.0"
></script>

{% endblock %}
